name: Update Factorio Data

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 0 1 * *' # Monthly on the 1st at midnight UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build exporter container
        run: |
          cd packages/exporter
          docker build -t factorio-exporter .
      
      - name: Run data extraction
        run: |
          # Create output directory if it doesn't exist
          mkdir -p packages/exporter/data/output
          
          # Run the exporter container
          # Mount the data output directory so results persist
          docker run --rm \
            -v "$(pwd)/packages/exporter/data/output:/exporter/data/output" \
            factorio-exporter
      
      - name: Check for changes
        id: check_changes
        run: |
          git add packages/exporter/data/output
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in Factorio data"
          fi
      
      - name: Get Factorio version
        if: steps.check_changes.outputs.has_changes == 'true'
        id: factorio_version
        run: |
          VERSION=$(jq -r '.version' packages/exporter/data/output/data.json | head -c 10 || echo "unknown")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Factorio data to v${{ steps.factorio_version.outputs.version }}"
          branch: automated/update-factorio-data
          delete-branch: true
          title: "chore: Update Factorio data"
          body: |
            ## Automated Factorio Data Update
            
            This PR updates the extracted Factorio game data including Space Age DLC content.
            
            **What changed:**
            - Updated `data.json` with latest entity/item prototypes
            - Refreshed sprite assets for all entities
            - Includes Space Age, Elevated Rails, and Quality DLC content
            
            **Verification:**
            - [ ] Confirm `data.json` contains Space Age entities (foundry, electromagnetic-plant, etc.)
            - [ ] Verify `__space-age__/`, `__elevated-rails__/`, `__quality__/` sprite directories exist
            - [ ] Check that `qualities` key exists in data.json with 5 tiers
            
            Generated by automated workflow on $(date -u +"%Y-%m-%d %H:%M UTC")
          labels: |
            automated
            dependencies
